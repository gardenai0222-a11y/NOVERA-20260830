name: 每日自動更新標案雷達 (PCC Daily Tender Crawler)
on:
  schedule:
    # 每天台灣時間清晨 07:30 執行 (UTC 23:30)
    - cron: '30 23 * * *'
    # 每天台灣時間中午 12:30 執行 (UTC 04:30)
    - cron: '30 4 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊「立即執行」
permissions:
  contents: write
jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案原始碼
        uses: actions/checkout@v4
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝依賴庫
        run: |
          pip install openpyxl
      - name: 執行政府採購網爬蟲
        run: |
          python run_crawler.py
      - name: 提交更新數據並觸發 Git 記錄 (內建永久防休眠)
        run: |
          git config --global user.name "NOVERA Radar Bot"
          git config --global user.email "bot@novera.tw"
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .keepalive
          git add tenders_data.js tenders_today.xlsx 今日政府電子採購網.xlsx .keepalive
          git commit -m "🤖 [自動排程] 即時更新標案雷達資料庫與防休眠活躍度" || echo "無變更"
          git push
      - name: 🚀 直接推送部署至 Netlify (零消耗 Netlify 額度，終生自動直連)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx netlify-cli deploy --prod --dir=. --site=novera-tw --auth=${{ secrets.NETLIFY_AUTH_TOKEN }}
